[package]
name = "monoova-rs-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for Monoova Payments API"
license = "MIT"
authors = ["Your Name <your.email@example.com>"]
repository = "https://github.com/your-org/monoova-rs-sdk"

[dependencies]
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
tokio = { version = "1.0", features = ["full"] }
url = "2.5"
thiserror = "1.0"

[dev-dependencies]
mockito = "1.4"
tokio-test = "0.4"

[[bin]]
name = "check_endpoints"
path = "src/bin/check_endpoints.rs"
